name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan secrets
        run: node backend/scripts/check-secrets.js
