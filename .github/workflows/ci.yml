name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: jack-house-web
      - uses: actions/checkout@v5
        with:
          repository: 1skyyks1/jack-house-analytics
          path: jack-house-analytics
          token: ${{ secrets.ANALYTICS_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jack-house-web/backend/package-lock.json
      - name: Build analytics packages
        run: |
          pnpm --dir jack-house-analytics install --frozen-lockfile
          pnpm --dir jack-house-analytics build
          mkdir -p .packed/jack-house-analytics
          pnpm --dir jack-house-analytics --filter @jack-house-analytics/server-core pack --pack-destination "$GITHUB_WORKSPACE/.packed/jack-house-analytics"
          pnpm --dir jack-house-analytics --filter @jack-house-analytics/server-express pack --pack-destination "$GITHUB_WORKSPACE/.packed/jack-house-analytics"
      - name: Install backend
        # Refresh only the analytics tarballs built above, then keep the actual
        # installation deterministic with npm ci.
        run: |
          npm update @jack-house-analytics/server-core @jack-house-analytics/server-express --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
        working-directory: jack-house-web/backend
      - name: Test backend
        run: npm test
        working-directory: jack-house-web/backend
      - name: Scan secrets
        run: npm run check:secrets
        working-directory: jack-house-web/backend
